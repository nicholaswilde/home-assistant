- sensor:
    - name: "lights on"
      unique_id: lights_on
      icon: mdi:lightbulb-on-outline
      state: >
        {% set lights = [
            states.light.attic_light,
            states.light.cabinet_lights,
            states.light.pantry_light,
            states.light.garage_light,
            states.light.cindy_s_sconce,
            states.light.nick_s_sconce,
            states.light.closet_light,
            states.light.porch_light,
            states.light.driveway_light,
            states.light.frontyard_landscape_lights,
            states.light.gazebo_lights,
            states.light.backyard_landscape_lights,
            states.light.backyard_light,
            states.light.window_lights,
            states.light.side_door_light,
            ] %}
        {{ lights | selectattr('state','eq','on') | list | count }}
        # 039d8a93dc5ceb8fa7ba63d9b7278f2c
# Front Door Motion
- trigger:
    - platform: event
      event_type: nest_event
      event_data:
        device_id: 039d8a93dc5ceb8fa7ba63d9b7278f2c
        type: camera_motion
    - platform: event
      event_type: nest_event
      event_data:
        device_id: 039d8a93dc5ceb8fa7ba63d9b7278f2c
        type: person_detected
    - platform: event
      event_type: nest_event
      event_data:
        device_id: <replace by your device id>
        type: doorbell_chime
  binary_sensor:
    - name: "Front Door Motion Sensor"
      unique_id: 03c0d255-6efc-493e-9398-14b5f014d36e
      device_class: motion
      auto_off: 60
      state: "on"

#Front Door Doorbell
- trigger:
    - platform: event
      event_type: nest_event
      event_data:
        device_id: 039d8a93dc5ceb8fa7ba63d9b7278f2c
        type: doorbell_chime
  binary_sensor:
    - name: "Front Door Doorbell"
      unique_id: 4f4d5476-3d7b-4208-ac8f-ead9b9d0c6e8
      auto_off: 15
      state: "true"

- binary_sensor:
    - name: Front Door Lock
      unique_id: 5abdd51d-6b6a-467f-a944-3f5e3fea1ac3
      device_class: lock
      state: "{{ states('lock.front_door_lock')=='unlocked' }}"
    - name: "Garage Door Opener"
      unique_id: baa6e0e0-f00f-477b-9291-885231803491
      device_class: garage_door
      state: "{{ states('cover.garage_door_opener')=='open' }}"

- sensor:
    - name: "Number of Sensors"
      default_entity_id: sensor.sensor_count
      state: >-
        {{ states.sensor | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of Automations"
      default_entity_id: sensor.automation_count
      state: >-
        {{ states.automation | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of Scripts"
      default_entity_id: sensor.script_count
      state: >-
        {{ states.script | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of Binary Sensors"
      default_entity_id: sensor.binary_sensor_count
      state: >-
        {{ states.binary_sensor | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of Devices"
      default_entity_id: sensor.tracker_count
      state: >-
        {{ states.device_tracker | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of Lights"
      default_entity_id: sensor.light_count
      state: >-
        {{ states.light | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of Switches"
      default_entity_id: sensor.switch_count
      state: >-
        {{ states.switch | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of People"
      default_entity_id: sensor.person_count
      state: >-
        {{ states.person | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of online Cameras"
      default_entity_id: sensor.camera_count
      state: >-
        {{ states.camera | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of Entities"
      default_entity_id: sensor.entity_count
      state: >-
        {{ states | rejectattr('state', 'eq', 'unavailable') | list | count }}
    - name: "Number of N/A Entities"
      default_entity_id: sensor.na_entity_count
      state: >-
        {{ states | selectattr('state', 'eq', 'unavailable') | map(attribute='entity_id') | list | count }}
    - name: "Month is"
      default_entity_id: sensor.month_is
      state: >-
        {{ ['January','Februrary','March','April','May','June','July','August','September','October','November','December'][now().month-1] }}
    - name: "Today is"
      default_entity_id: sensor.today_is
      state: >-
        {{ ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][now().weekday()] }}

- switch:
    - name: "Lomi"
      default_entity_id: switch.lomi
      state: "{{ is_state('light.lomi_light', 'on') }}"
      turn_on:
        - action: light.turn_on
          target:
            entity_id: switch.lomi_open
      turn_off:
        - action: light.turn_off
          target:
            entity_id: switch.lomi_close